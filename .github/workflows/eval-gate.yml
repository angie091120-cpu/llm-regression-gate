name: eval-gate

on:
  pull_request:
    paths:
      - "prompts/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      # PR-triggered runs stay free: mocked pytest (AC1) plus an offline
      # regression-diff smoke test against the pre-generated AC3 fixtures
      # (tests/fixtures/) -- no ANTHROPIC_API_KEY needed. This exercises the
      # real diff-and-comment pipeline on every prompts/** PR without
      # spending API budget on every push. A full real-API evaluation of the
      # PR's actual prompt change is deliberately deferred to a manual
      # `workflow_dispatch` run below -- see SPEC.md §6 "Cost control" and
      # docs/DECISIONS.md D-006.
      - name: pytest (mocked, no API key)
        if: github.event_name == 'pull_request'
        run: pytest -q

      - name: offline regression-diff smoke test (fixtures, no API key)
        if: github.event_name == 'pull_request'
        run: |
          python -m evalkit.diff \
            --baseline tests/fixtures/baseline_report.json \
            --candidate tests/fixtures/degraded_report.json \
            --warn-threshold 0.03 --critical-threshold 0.08 \
            --out diff_report.json || true

      - name: post PR scorecard comment (smoke-test data)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("diff_report.json", "utf8"));
            const body = [
              "### eval-gate scorecard (PR smoke test -- no API key used)",
              "",
              `- candidate pass rate: ${d.candidate_pass_rate}`,
              `- delta vs. baseline: ${d.overall_delta}`,
              `- severity: ${d.severity}`,
              "",
              "This is the free, PR-triggered smoke test: it exercises the " +
                "regression-diff pipeline against fixed fixture reports " +
                "(`tests/fixtures/`), not a real evaluation of this PR's " +
                "prompt change. Run this workflow manually via " +
                "`workflow_dispatch` with `ANTHROPIC_API_KEY` set to evaluate " +
                "the actual prompt change against the golden dataset.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Real-API evaluation: manual only, to control API cost (SPEC.md §6).
      # Evaluates the checked-out prompt against the golden dataset for
      # real, diffs against the committed baseline, and fails the job on a
      # critical regression (evalkit.diff exits non-zero -- see AC3).
      - name: real-API eval + diff against baseline
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m evalkit.run_eval --prompt-version v1 --dataset golden_dataset.json --out eval_report.json
          python -m evalkit.diff --baseline eval_reports/baseline.json --candidate eval_report.json \
            --warn-threshold 0.03 --critical-threshold 0.08 --out diff_report.json
