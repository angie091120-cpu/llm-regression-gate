name: test

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: pytest (mocked, no API key)
        run: pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    # Repo default token permission is "read repository contents and packages
    # only" (all other scopes none) -- gitleaks-action v2 unconditionally
    # calls GET /repos/{owner}/{repo}/pulls/{pull_number}/commits on every
    # pull_request event before it does anything else, which 403s without an
    # explicit pull-requests:read grant. Declared here at job level (not
    # workflow level) so the pytest job's token is untouched.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
